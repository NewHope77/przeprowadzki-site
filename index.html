<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Strona w przygotowaniu</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font:500 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:#0E1B2C;background:#F6F4EF}
  .card{max-width:520px;text-align:center;background:#fff;border:1px solid #E4E7EC;
    border-radius:24px;padding:48px 32px;box-shadow:0 10px 30px rgba(14,27,44,.08)}
  .ic{width:64px;height:64px;margin:0 auto 24px;border-radius:18px;background:#FF6A1A;
    display:grid;place-items:center}
  .ic svg{width:34px;height:34px}
  h1{font-size:26px;margin:0 0 12px;letter-spacing:-.01em}
  p{margin:0;color:#5F6B7A}
</style>
</head>
<body>
  <main class="card">
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
      </svg>
    </div>
    <h1>Strona w przygotowaniu</h1>
    <p>Trwają prace nad serwisem. Zapraszamy wkrótce.</p>
  </main>
</body>
</html>
